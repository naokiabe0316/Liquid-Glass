<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Jelly Drop — Liquid Glass</title>
  <style>
    html, body { height: 100%; margin: 0; background: #000; overflow: hidden; }
    #app { position: fixed; inset: 0; }
    canvas { display: block; touch-action: none; cursor: pointer; }
    #hud {
      position: fixed; left: 14px; top: 14px; z-index: 10; pointer-events: none;
      font: 13px -apple-system, Helvetica, Arial, sans-serif; color: #111;
      background: rgba(255,255,255,.65); padding: 6px 10px; border-radius: 999px;
      backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
    }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <div id="app"></div>
  <div id="hud">タップ / クリックで球を追加</div>
  <script type="module">
    import * as THREE from 'three';
    import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

    // ---- 設定 ---------------------------------------------------------
    const CONFIG = {
      startCount: 6,
      maxSpheres: 24,
      radiusFrac: 0.085,     // 球の半径（画面高さに対する割合）
      // マテリアル（透明なゼリー／シリコン質感）
      transmission: 1.0, roughness: 0.05, ior: 1.33, thickness: 1.1,
      clearcoat: 0.35, clearcoatRoughness: 0.12, envMapIntensity: 0.7,
      // 着地時の潰れ
      squashMax: 0.30, pushK: 0.9, bulge: 0.55, bulgeZ: 0.22, squashEase: 0.45,
      // 物理
      gravityFrac: 0.0009,   // 重力（画面高さに対する割合 / frame^2）
      airDrag: 0.992, wallK: 0.22, wallDamp: 0.5, maxOverFrac: 0.45,
      collRest: 0.35,
      tiles: 9               // チェッカーの分割数
    };

    // ---- レンダラー / シーン / カメラ ----------------------------------
    const app = document.getElementById('app');
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.05;
    app.appendChild(renderer.domElement);

    const scene = new THREE.Scene();

    // ガラスにハイライトを乗せるための環境マップ
    const pmrem = new THREE.PMREMGenerator(renderer);
    scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

    const camera = new THREE.PerspectiveCamera(35, 1, 0.1, 100);
    camera.position.set(0, 0, 9);

    // ---- 白黒チェッカー背景 -------------------------------------------
    function makeCheckerTexture(n) {
      const px = 1024, cell = px / (n * 2);
      const c = document.createElement('canvas'); c.width = c.height = px;
      const ctx = c.getContext('2d');
      for (let y = 0; y < n * 2; y++) {
        for (let x = 0; x < n * 2; x++) {
          ctx.fillStyle = (x + y) % 2 ? '#0a0a0a' : '#f5f5f5';
          ctx.fillRect(x * cell, y * cell, cell, cell);
        }
      }
      const tex = new THREE.CanvasTexture(c);
      tex.colorSpace = THREE.SRGBColorSpace;
      tex.magFilter = THREE.NearestFilter;
      tex.minFilter = THREE.LinearMipmapLinearFilter;
      return tex;
    }
    const checkerTex = makeCheckerTexture(CONFIG.tiles);
    // 球の後ろに置く板（屈折で歪んで見えるのはコレ）
    const bgPlane = new THREE.Mesh(
      new THREE.PlaneGeometry(1, 1),
      new THREE.MeshBasicMaterial({ map: checkerTex, toneMapped: false })
    );
    bgPlane.position.z = -2;
    scene.add(bgPlane);

    // ---- ゼリー球のマテリアル＆ジオメトリ ------------------------------
    const geo = new THREE.SphereGeometry(0.5, 96, 64);
    const material = new THREE.MeshPhysicalMaterial({
      color: 0xffffff,
      transmission: CONFIG.transmission, thickness: CONFIG.thickness, ior: CONFIG.ior,
      roughness: CONFIG.roughness, metalness: 0,
      clearcoat: CONFIG.clearcoat, clearcoatRoughness: CONFIG.clearcoatRoughness,
      envMapIntensity: CONFIG.envMapIntensity, transparent: true
    });

    const balls = [];
    function addBall(x, y) {
      if (balls.length >= CONFIG.maxSpheres) return;
      const mesh = new THREE.Mesh(geo, material);
      scene.add(mesh);
      balls.push({
        mesh,
        pos: new THREE.Vector2(x, y),
        vel: new THREE.Vector2((Math.random() - 0.5) * 0.04, 0),
        cx: 0, cy: 0
      });
    }

    // ---- 画面サイズ → ワールド座標 ------------------------------------
    let viewH = 1, viewW = 1, R = 0.5, bound = new THREE.Vector2(), gravity = 0.01;
    function visibleHeightAt(dist) { return 2 * dist * Math.tan(THREE.MathUtils.degToRad(camera.fov) / 2); }

    function resize() {
      const w = innerWidth, h = innerHeight;
      renderer.setSize(w, h);
      camera.aspect = w / h; camera.updateProjectionMatrix();

      viewH = visibleHeightAt(camera.position.z);
      viewW = viewH * camera.aspect;
      R = CONFIG.radiusFrac * viewH;
      bound.set(viewW / 2 - R, viewH / 2 - R);
      gravity = CONFIG.gravityFrac * viewH;

      // 背景板をカメラいっぱいに広げる
      const bgH = visibleHeightAt(camera.position.z - bgPlane.position.z);
      bgPlane.scale.set(bgH * camera.aspect, bgH, 1);

      // タイルが常に正方形に見えるよう縦横比を補正
      checkerTex.repeat.set(camera.aspect >= 1 ? camera.aspect : 1,
                            camera.aspect >= 1 ? 1 : 1 / camera.aspect);
      checkerTex.offset.set((1 - checkerTex.repeat.x) / 2, (1 - checkerTex.repeat.y) / 2);
      checkerTex.needsUpdate = true;
    }
    addEventListener('resize', resize);

    // ---- 物理ステップ -------------------------------------------------
    function squashFrac(over) {
      const a = Math.abs(over), k = CONFIG.pushK * R;
      return CONFIG.squashMax * a / (a + k);
    }

    function step() {
      const n = balls.length;
      // 重力・空気抵抗・移動・壁＆床
      for (const b of balls) {
        b.vel.y -= gravity;
        b.vel.multiplyScalar(CONFIG.airDrag);
        b.pos.add(b.vel);

        if (b.pos.x >  bound.x) { b.vel.x -= (b.pos.x - bound.x) * CONFIG.wallK; b.vel.x *= CONFIG.wallDamp; }
        if (b.pos.x < -bound.x) { b.vel.x -= (b.pos.x + bound.x) * CONFIG.wallK; b.vel.x *= CONFIG.wallDamp; }
        if (b.pos.y >  bound.y) { b.vel.y -= (b.pos.y - bound.y) * CONFIG.wallK; b.vel.y *= CONFIG.wallDamp; }
        if (b.pos.y < -bound.y) { b.vel.y -= (b.pos.y + bound.y) * CONFIG.wallK; b.vel.y *= CONFIG.wallDamp; }
      }

      // 球どうしの衝突
      for (let i = 0; i < n; i++) {
        for (let j = i + 1; j < n; j++) {
          const a = balls[i], c = balls[j];
          const dx = c.pos.x - a.pos.x, dy = c.pos.y - a.pos.y;
          let d = Math.hypot(dx, dy); const min = 2 * R * 0.96;
          if (d > 0 && d < min) {
            const nx = dx / d, ny = dy / d, overlap = (min - d) * 0.5;
            a.pos.x -= nx * overlap; a.pos.y -= ny * overlap;
            c.pos.x += nx * overlap; c.pos.y += ny * overlap;
            const rel = (c.vel.x - a.vel.x) * nx + (c.vel.y - a.vel.y) * ny;
            if (rel < 0) {
              const imp = -rel * (1 + CONFIG.collRest) * 0.5;
              a.vel.x -= imp * nx; a.vel.y -= imp * ny;
              c.vel.x += imp * nx; c.vel.y += imp * ny;
            }
          }
        }
      }

      // 潰れ＆膨らみを反映して描画
      const maxOver = CONFIG.maxOverFrac * R;
      for (const b of balls) {
        let overX = 0, overY = 0;
        if (b.pos.x >  bound.x) overX =  Math.min(b.pos.x - bound.x, maxOver);
        if (b.pos.x < -bound.x) overX = -Math.min(-(b.pos.x + bound.x), maxOver);
        if (b.pos.y >  bound.y) overY =  Math.min(b.pos.y - bound.y, maxOver);
        if (b.pos.y < -bound.y) overY = -Math.min(-(b.pos.y + bound.y), maxOver);

        b.cx += (squashFrac(overX) - b.cx) * CONFIG.squashEase;
        b.cy += (squashFrac(overY) - b.cy) * CONFIG.squashEase;

        const sx = (1 - b.cx) * (1 + CONFIG.bulge * b.cy);
        const sy = (1 - b.cy) * (1 + CONFIG.bulge * b.cx);
        const sz = 1 + CONFIG.bulgeZ * (b.cx + b.cy);

        b.mesh.position.set(b.pos.x, b.pos.y, 0);
        b.mesh.scale.set(2 * R * sx, 2 * R * sy, 2 * R * sz);
      }
    }

    // ---- 入力：タップ／クリックで上から落とす --------------------------
    renderer.domElement.addEventListener('pointerdown', (e) => {
      const x = (e.clientX / innerWidth - 0.5) * viewW;
      addBall(x, bound.y);
    });

    // ---- 起動 ---------------------------------------------------------
    resize();
    for (let i = 0; i < CONFIG.startCount; i++) {
      addBall((Math.random() - 0.5) * viewW * 0.8, bound.y * (0.4 + i * 0.5));
    }

    function animate() {
      requestAnimationFrame(animate);
      step();
      renderer.render(scene, camera);
    }
    animate();
  </script>
</body>
</html>
